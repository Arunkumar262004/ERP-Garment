services:
  - type: web
    name: erp-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile.prod
    plan: free
    envVars:
      - key: APP_NAME
        value: ERP System
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: base64:L5UKgWjZPk3RT36C8KGJCjsYT/YQ23wzll5PRcURvgE=
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: erp-postgres
          property: connectionString
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: N8N_QUOTATION_WEBHOOK_URL
        sync: false
      - key: N8N_WEBHOOK_SECRET
        sync: false
      - key: N8N_CHAT_WEBHOOK_URL
        sync: false
      - key: N8N_LOOKUP_SECRET
        sync: false

databases:
  - name: erp-postgres
    databaseName: erp
    user: erp_user
    plan: free
