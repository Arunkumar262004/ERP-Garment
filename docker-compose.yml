services:
  mysql:
    image: mysql:8.4
    container_name: erp_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-erp}
      MYSQL_USER: ${DB_USERNAME:-erp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-erp_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - erp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: erp_backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - erp_backend_vendor:/var/www/vendor
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_NAME: "ERP System"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${BACKEND_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-erp}
      DB_USERNAME: ${DB_USERNAME:-erp}
      DB_PASSWORD: ${DB_PASSWORD:-erp_secret}
      PHP_CLI_SERVER_WORKERS: 4
    depends_on:
      mysql:
        condition: service_healthy

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: erp_n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
    volumes:
      - erp_n8n_data:/home/node/.n8n

  frontend:
    build:
      context: ./frontend
    container_name: erp_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - erp_frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}/api
    depends_on:
      - backend

volumes:
  erp_mysql_data:
  erp_backend_vendor:
  erp_frontend_node_modules:
  erp_n8n_data:
